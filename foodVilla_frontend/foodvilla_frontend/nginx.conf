server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — unknown paths must fall back
    # to index.html rather than 404ing at the nginx layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
