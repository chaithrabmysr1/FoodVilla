server:
  port: 8083  # unique port for foodcatalogue-service

spring:
  application:
    name: foodcatalogue-service
  datasource:
    url: jdbc:mysql://localhost:3306/foodvilla_foodCatalogueService
    username: root
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

logging:
  level:
    com.example.foodVilla.foodcatalogue_service: DEBUG

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable (same value used by user-service). See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}
