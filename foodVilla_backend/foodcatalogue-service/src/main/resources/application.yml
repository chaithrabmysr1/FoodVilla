server:
  port: ${PORT:8083}  # unique port for foodcatalogue-service

spring:
  application:
    name: foodcatalogue-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodvilla_foodCatalogueService}
    username: ${DB_USERNAME:root}
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.example.foodVilla.foodcatalogue_service: DEBUG

cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Base URL of restaurant-service, called directly (no service discovery).
# Supplied externally via RESTAURANT_SERVICE_URL for cloud deployment.
restaurant:
  service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8082/api/restaurants/}

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable (same value used by user-service). See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}

# Only the health endpoint is exposed — no env/beans/etc. leaking over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
