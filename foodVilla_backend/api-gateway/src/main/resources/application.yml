server:
  port: ${PORT:8080}  # single entry point for web/mobile clients

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Static routes — no service discovery (Eureka was removed). Each
      # downstream service already expects the full /api/... path itself,
      # so no StripPrefix filter is used; the incoming path is forwarded as-is.
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/restaurants/**
        - id: catalogue-service
          uri: ${CATALOGUE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/catalogue/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payments/**
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/delivery/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

logging:
  level:
    com.example.foodVilla.api_gateway: DEBUG

# Only the health endpoint is exposed — no env/beans/etc. leaking over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
