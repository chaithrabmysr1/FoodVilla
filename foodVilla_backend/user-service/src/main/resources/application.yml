spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/foodvilla_userService
    username: root
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable. See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    # Optional: force IP registration
    prefer-ip-address: true
