spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodvilla_userService}
    username: ${DB_USERNAME:root}
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable. See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}

cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:8081}

# Only the health endpoint is exposed — no env/beans/etc. leaking over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
