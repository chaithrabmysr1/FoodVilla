server:
  port: ${PORT:8082}

spring:
  application:
    name: restaurant-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodvilla_restaurantService}
    username: ${DB_USERNAME:root}
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    com.example.foodVilla.restaurant_service: DEBUG

cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable (same value used by user-service). See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    acks: all

kafka:
  topic:
    restaurant-events: ${KAFKA_TOPIC_RESTAURANT_EVENTS:foodvilla.restaurant.events}

# Only the health endpoint is exposed — no env/beans/etc. leaking over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
