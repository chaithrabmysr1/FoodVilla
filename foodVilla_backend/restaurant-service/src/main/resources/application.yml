server:
  port: 8082

spring:
  application:
    name: restaurant-service

  datasource:
    url: jdbc:mysql://localhost:3306/foodvilla_restaurantService
    username: root
    # Supplied externally — set the DB_PASSWORD environment variable before
    # starting this service. See foodVilla_backend/CONFIGURATION.md.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

logging:
  level:
    com.example.foodVilla.restaurant_service: DEBUG

# JWT signing secret — supplied externally via the JWT_SECRET environment
# variable (same value used by user-service). See foodVilla_backend/CONFIGURATION.md.
jwt:
  secret: ${JWT_SECRET}
